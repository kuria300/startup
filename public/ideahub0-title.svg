<svg xmlns="http://www.w3.org/2000/svg" width="280" height="84" viewBox="0 0 280 84" role="img" aria-labelledby="title desc">
  <title id="title">IdeaHub0</title>
  <desc id="desc">The IdeaHub0 project title in soft pink light</desc>
  <defs>
    <linearGradient id="pinkLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6e8" />
      <stop offset="0.5" stop-color="#ff9ec7" />
      <stop offset="1" stop-color="#ff72ad" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <text x="140" y="56" fill="url(#pinkLight)" filter="url(#glow)" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="-1" text-anchor="middle">IdeaHub0</text>
</svg>